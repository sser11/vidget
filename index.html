<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel & Shopping Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1><i class="fas fa-chalkboard-user"></i> Travel & Shopping Dashboard</h1>
            <p>Управляйте задачами, находите авиабилеты и товары на eBay</p>
        </header>

        <div class="controls">
            <button class="btn btn-primary" id="addTodoWidget">
                <i class="fas fa-list-check"></i> Добавить виджет задач
            </button>
            <button class="btn btn-primary" id="addFlightWidget">
                <i class="fas fa-plane"></i> Добавить виджет авиабилетов
            </button>
            <button class="btn btn-primary" id="addEbayWidget">
                <i class="fab fa-ebay"></i> Добавить виджет eBay
            </button>
            <button class="btn btn-danger" id="clearAllWidgets">
                <i class="fas fa-trash-alt"></i> Очистить все виджеты
            </button>
        </div>

        <div id="widgetsGrid" class="widgets-grid"></div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
